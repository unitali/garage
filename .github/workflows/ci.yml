# Testes e build em PR para a develop e em push na develop.
# PRs para a main não passam aqui: o de release é aberto pelo GitHub Actions (que não dispara
# workflows) e qualquer outro é encaminhado pelo pr-guard.yml — o código já foi testado na develop.

name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# só lê o código: nenhum passo escreve no repositório
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
