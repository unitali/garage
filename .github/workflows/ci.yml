# Testes e build em PR para a develop e em push na develop.
# PRs para a main não passam aqui: o de release é aberto pelo GitHub Actions (que não dispara
# workflows) e qualquer outro é encaminhado pelo pr-guard.yml — o código já foi testado na develop.

name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
